name: Auto Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Name
        id: extract_version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | grep -o '".*"' | tr -d '"')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Extracted version: $VERSION_NAME"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git tag -l "v$VERSION_NAME" | grep -q "v$VERSION_NAME"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION_NAME already exists locally. Skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION_NAME does not exist locally. Proceeding with release."
          fi

      - name: Setup Java
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix Gradle Wrapper & Make Executable
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          wget -qO gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew

      - name: Generate Debug Keystore (If Missing)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found, generating a new one for GitHub Actions..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi

      - name: Build Debug APK
        if: steps.check_tag.outputs.exists == 'false'
        run: ./gradlew assembleDebug

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "LexiVerse Update v${{ env.VERSION_NAME }}"
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
