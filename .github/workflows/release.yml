name: Build & Release LexiVerse APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Name
        id: extract_version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | grep -o '".*"' | tr -d '"')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.${{ github.run_number }}"; fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Extracted version: $VERSION_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        run: |
          echo "Forcing a fresh Gradle wrapper generation..."
          rm -f gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          gradle wrapper
          chmod +x gradlew

      - name: Generate Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating a temporary debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Rename APK
        id: locate_apk
        run: |
          mkdir -p build_output
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build_output/LexiVerse-v${{ env.VERSION_NAME }}.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build_output/LexiVerse-v${{ env.VERSION_NAME }}.apk
          else
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK_FILE" build_output/LexiVerse-v${{ env.VERSION_NAME }}.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexiVerse-APK
          path: build_output/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}-${{ github.run_number }}"
          name: "LexiVerse Update v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})"
          files: build_output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
