name: Build & Release LexiVerse APK

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug
          ./gradlew assembleRelease --no-daemon --stacktrace || gradle assembleRelease

      - name: Locate and Rename APK
        id: locate_apk
        run: |
          mkdir -p build_output
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build_output/LexiVerse-release.apk
            echo "apk_path=build_output/LexiVerse-release.apk" >> $GITHUB_OUTPUT
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build_output/LexiVerse-release.apk
            echo "apk_path=build_output/LexiVerse-release.apk" >> $GITHUB_OUTPUT
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build_output/LexiVerse-debug.apk
            echo "apk_path=build_output/LexiVerse-debug.apk" >> $GITHUB_OUTPUT
          else
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK_FILE" build_output/LexiVerse-latest.apk
            echo "apk_path=build_output/LexiVerse-latest.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexiVerse-APK
          path: build_output/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
